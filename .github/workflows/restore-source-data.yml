name: Restore verified source data
on:
  push:
    branches: [feat/muslim-sqlite]
    paths: [.github/workflows/restore-source-data.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned sources and verify
        shell: bash
        run: |
          git clone https://github.com/alpheios-project/lan.git /tmp/lane-source
          git -C /tmp/lane-source checkout 7dd04e1182c13a4b0883978867d2a3b04616542a
          curl --fail --location https://raw.githubusercontent.com/asim/hadith-json/main/db/by_book/the_9_books/muslim.json -o /tmp/muslim.json
          python3 scripts/import_muslim.py /tmp/muslim.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('arabic/dict')
          manifest = json.loads((root/'source.json').read_text())
          with zipfile.ZipFile(root/'lane-xml.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name, digest in sorted(manifest['files'].items()):
                  data = (Path('/tmp/lane-source/db/lexica/ara/lan')/name).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == digest, name
                  info = zipfile.ZipInfo(name, (2026,11,15,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, data)
          assert hashlib.sha256((root/'lane-xml.zip').read_bytes()).hexdigest() == manifest['archive_sha256']
          PY
          python3 scripts/lane_dictionary.py --build
      - name: Commit verified data and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-source-data.yml
          git add arabic/dict/lane-xml.zip hadith/data/muslim.json.gz hadith/muslim-source.json
          git commit -m 'Bundle verified Muslim and Lane source data'
          git push origin HEAD:feat/muslim-sqlite
